<title>ProxyDirector Agent Control Loop</title><desc>In a chat turn the language model calls scoped Pydantic AI tools. Blender measures geometry and returns a report summary to the next model turn. The full report can be requested via latest_framing_status. A failing plan can be revised, and a passing audit unlocks the prompt builder. Dry-run requests stay local. Live generation needs explicit human authorization and sufficient credits. The team visually reviews the generated clip separately. The example measurements come from archived run 20261116_150621_astra_agent_s4207.</desc>
<text x="43" y="64" font-size="48" font-weight="700" fill="#172E40" text-anchor="start">ProxyDirector agent control loop</text>
<text x="44" y="103" font-size="25" font-weight="500" fill="#405B6C" text-anchor="start">How the director uses a measured observation to choose its next action</text>
